services:
  env-dashboard:
    image: "mcr.microsoft.com/dotnet/nightly/aspire-dashboard:latest"
    ports:
      - "18888"
    expose:
      - "18889"
      - "18890"
    networks:
      - "aspire"
    restart: "always"
  postgres:
    image: "docker.io/library/postgres:17.6"
    environment:
      POSTGRES_HOST_AUTH_METHOD: "scram-sha-256"
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    expose:
      - "5432"
    networks:
      - "aspire"
  practitioner:
    image: "${PRACTITIONER_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${PRACTITIONER_PORT}"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=care-call"
      DEFAULTCONNECTION_HOST: "postgres"
      DEFAULTCONNECTION_PORT: "5432"
      DEFAULTCONNECTION_USERNAME: "postgres"
      DEFAULTCONNECTION_PASSWORD: "${POSTGRES_PASSWORD}"
      DEFAULTCONNECTION_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/care-call"
      DEFAULTCONNECTION_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/care-call"
      DEFAULTCONNECTION_DATABASENAME: "care-call"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://env-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "practitioner"
    ports:
      - "${PRACTITIONER_PORT}"
    depends_on:
      postgres:
        condition: "service_started"
    networks:
      - "aspire"
  appointment:
    image: "${APPOINTMENT_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${APPOINTMENT_PORT}"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=care-call-appointment"
      DEFAULTCONNECTION_HOST: "postgres"
      DEFAULTCONNECTION_PORT: "5432"
      DEFAULTCONNECTION_USERNAME: "postgres"
      DEFAULTCONNECTION_PASSWORD: "${POSTGRES_PASSWORD}"
      DEFAULTCONNECTION_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/care-call-appointment"
      DEFAULTCONNECTION_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/care-call-appointment"
      DEFAULTCONNECTION_DATABASENAME: "care-call-appointment"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://env-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "appointment"
    ports:
      - "${APPOINTMENT_PORT}"
    depends_on:
      postgres:
        condition: "service_started"
    networks:
      - "aspire"
  notification:
    image: "${NOTIFICATION_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${NOTIFICATION_PORT}"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=care-call-notification"
      DEFAULTCONNECTION_HOST: "postgres"
      DEFAULTCONNECTION_PORT: "5432"
      DEFAULTCONNECTION_USERNAME: "postgres"
      DEFAULTCONNECTION_PASSWORD: "${POSTGRES_PASSWORD}"
      DEFAULTCONNECTION_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/care-call-notification"
      DEFAULTCONNECTION_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/care-call-notification"
      DEFAULTCONNECTION_DATABASENAME: "care-call-notification"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://env-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "notification"
    ports:
      - "${NOTIFICATION_PORT}"
    depends_on:
      postgres:
        condition: "service_started"
    networks:
      - "aspire"
  handbook:
    image: "${HANDBOOK_IMAGE}"
    environment:
      OTEL_DOTNET_EXPERIMENTAL_OTLP_RETRY: "in_memory"
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
      HTTP_PORTS: "${HANDBOOK_PORT}"
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Username=postgres;Password=${POSTGRES_PASSWORD};Database=handbook"
      DEFAULTCONNECTION_HOST: "postgres"
      DEFAULTCONNECTION_PORT: "5432"
      DEFAULTCONNECTION_USERNAME: "postgres"
      DEFAULTCONNECTION_PASSWORD: "${POSTGRES_PASSWORD}"
      DEFAULTCONNECTION_URI: "postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/handbook"
      DEFAULTCONNECTION_JDBCCONNECTIONSTRING: "jdbc:postgresql://postgres:5432/handbook"
      DEFAULTCONNECTION_DATABASENAME: "handbook"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://env-dashboard:18889"
      OTEL_EXPORTER_OTLP_PROTOCOL: "grpc"
      OTEL_SERVICE_NAME: "handbook"
    ports:
      - "${HANDBOOK_PORT}"
    depends_on:
      postgres:
        condition: "service_started"
    networks:
      - "aspire"
networks:
  aspire:
    driver: "bridge"
